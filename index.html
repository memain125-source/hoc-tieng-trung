<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học từ vựng tiếng Trung HSK 2</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { max-width: 860px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
  h1 { color: #c0392b; text-align: center; font-size: 24px; }
  h3 { margin-top: 0; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  textarea { width: 100%; height: 120px; padding: 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; }
  button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 4px; }
  .btn-primary { background: #c0392b; color: white; }
  .btn-primary:hover { background: #a93226; }
  .btn-secondary { background: #3498db; color: white; }
  .btn-secondary:hover { background: #2980b9; }
  .btn-ghost { background: #ecf0f1; color: #333; }
  .btn-ghost:hover { background: #d5dbdb; }
  .btn-append { background: #16a085; color: white; }
  .btn-append:hover { background: #138d75; }
  .btn-toggle { background: #9b59b6; color: white; }
  .btn-toggle.on { background: #8e44ad; }
  .btn-next { background: #27ae60; color: white; font-weight: bold; }
  .btn-next:hover { background: #229954; }
  .btn-next.highlight { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(39,174,96,.7); }
    50% { box-shadow: 0 0 0 8px rgba(39,174,96,0); }
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { flex: 1; background: #ecf0f1; min-width: 100px; }
  .tabs button.active { background: #c0392b; color: white; }
  .hidden { display: none !important; }
  .question { text-align: center; padding: 20px 0; }
  .question .prompt { font-size: 40px; margin-bottom: 6px; }
  .question .sub { font-size: 17px; color: #666; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .options button { padding: 16px; font-size: 20px; background: white; border: 2px solid #ddd; }
  .options button:hover { border-color: #c0392b; }
  .options button.correct { background: #2ecc71; color: white; border-color: #2ecc71; }
  .options button.wrong { background: #e74c3c; color: white; border-color: #e74c3c; }
  .stats { display: flex; gap: 12px; justify-content: center; font-size: 15px; flex-wrap: wrap; }
  .stats span { padding: 6px 12px; background: #ecf0f1; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #f8f8f8; }
  .hint { font-size: 13px; color: #888; margin-top: 6px; }
  .type-box { display: flex; gap: 8px; margin-top: 16px; }
  .type-box input { flex: 1; padding: 14px 16px; font-size: 22px; border: 2px solid #ddd; border-radius: 8px; text-align: center; }
  .type-box input:focus { outline: none; border-color: #c0392b; }
  .type-box input.correct { border-color: #2ecc71; background: #eafaf1; }
  .type-box input.wrong { border-color: #e74c3c; background: #fdedec; }
  .type-box button { padding: 14px 24px; font-size: 16px; }
  .answer-reveal { margin-top: 12px; font-size: 18px; color: #c0392b; text-align: center; min-height: 24px; }
  .file-label { display: inline-block; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; color: white; }
  @media (max-width: 600px) {
    .options { grid-template-columns: 1fr; }
    .question .prompt { font-size: 32px; }
    .type-box { flex-direction: column; }
  }
</style>
</head>
<body>

<h1>📚 Học từ vựng tiếng Trung HSK 2</h1>

<!-- ========== TAB NHẬP ========== -->
<div id="tab-input">
  <div class="card">
    <h3>Nhập list từ bằng text</h3>
    <p class="hint">Mỗi dòng: <b>Hán tự | Pinyin | Nghĩa</b> (cách nhau dấu <b>|</b>, <b>Tab</b> hoặc <b>,</b>)</p>
    <textarea id="inputArea" placeholder="旅游 | lǚyóu | Du lịch
觉得 | juéde | Cảm thấy, cho rằng, nghĩ rằng
最 | zuì | Nhất (chỉ mức độ cao nhất)"></textarea>
    <div style="margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
      <button class="btn-primary" onclick="loadWords(false)">📥 Thay thế list bằng text</button>
      <button class="btn-append" onclick="loadWords(true)">➕ Thêm list bằng text</button>
    </div>
  </div>

  <div class="card">
    <h3>Nhập từ file Excel</h3>
    <p class="hint">File cần 3 cột: <b>Hán tự | Pinyin | Nghĩa</b>. Hỗ trợ .xlsx, .xls, .csv</p>
    <div style="margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
      <label class="file-label btn-primary">
        📂 Nhập Excel (thay thế list)
        <input type="file" id="excelReplace" accept=".xlsx,.xls,.csv" style="display:none;" onchange="loadExcel(event, false)">
      </label>
      <label class="file-label btn-append">
        📂➕ Nhập Excel (thêm từ mới)
        <input type="file" id="excelAppend" accept=".xlsx,.xls,.csv" style="display:none;" onchange="loadExcel(event, true)">
      </label>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
      <button class="btn-ghost" onclick="clearWords()">🗑 Xóa hết</button>
      <button class="btn-ghost" onclick="restoreDefaults()">↩️ Khôi phục list HSK 2 mặc định</button>
      <span id="countInfo" style="color: #666;"></span>
    </div>
  </div>
</div>

<!-- ========== TAB HỌC ========== -->
<div id="tab-quiz" class="hidden">
  <div class="card">
    <div class="tabs">
      <button data-mode="hanzi" class="active" onclick="setMode('hanzi')">Điền Hán tự</button>
      <button data-mode="pinyin" onclick="setMode('pinyin')">Điền Pinyin</button>
      <button data-mode="meaning" onclick="setMode('meaning')">Điền Nghĩa</button>
      <button data-mode="wrong" onclick="setMode('wrong')" style="background:#f39c12; color:white;">🔥 Ôn từ sai</button>
    </div>
    <div style="text-align: center; margin-bottom: 12px;">
      <button id="typeHanziBtn" class="btn-toggle" onclick="toggleType('hanzi')">⌨️ Gõ Hán tự (hiện Nghĩa)</button>
      <button id="typePinyinBtn" class="btn-toggle" onclick="toggleType('pinyin')">⌨️ Gõ Pinyin (hiện Hán tự + Nghĩa)</button>
    </div>
    <div class="stats">
      <span>✅ Đúng: <b id="correctCount">0</b></span>
      <span>❌ Sai: <b id="wrongCount">0</b></span>
      <span>📝 Tổng: <b id="totalCount">0</b></span>
      <span>🔥 Từ sai: <b id="wrongPoolCount">0</b></span>
    </div>
    <div class="question">
      <div class="prompt" id="promptText">—</div>
      <div class="sub" id="subText"></div>
    </div>
    <div class="options" id="optionsBox"></div>
    <div class="type-box hidden" id="typeBox">
      <input type="text" id="typeInput" placeholder="Gõ đáp án rồi nhấn Enter..." onkeydown="if(event.key==='Enter') checkTyped()">
      <button class="btn-primary" onclick="checkTyped()">Kiểm tra</button>
    </div>
    <div class="answer-reveal" id="answerReveal"></div>
    <div style="text-align: center; margin-top: 16px;">
      <button id="nextBtn" class="btn-next" onclick="nextQuestion()">⏭ Câu tiếp theo</button>
      <button class="btn-ghost" onclick="resetStats()">🔄 Reset điểm</button>
      <button class="btn-ghost" onclick="resetWrongPool()">🧹 Xóa từ sai</button>
    </div>
  </div>
</div>

<!-- ========== TAB XEM LIST ========== -->
<div id="tab-list" class="hidden">
  <div class="card">
    <h3>Danh sách từ (<span id="listCount">0</span> từ)</h3>
    <div style="max-height: 400px; overflow-y: auto;">
      <table>
        <thead><tr><th>Hán tự</th><th>Pinyin</th><th>Nghĩa</th></tr></thead>
        <tbody id="wordTable"></tbody>
      </table>
    </div>
  </div>
</div>

<div style="text-align: center; margin-top: 20px;">
  <button class="btn-secondary" onclick="showTab('input')">📝 Nhập từ</button>
  <button class="btn-secondary" onclick="showTab('quiz')">🎯 Học</button>
  <button class="btn-secondary" onclick="showTab('list')">📋 Xem list</button>
</div>

// ==================== BIẾN TOÀN CỤC ====================
let words = [];
let wrongPool = [];
let currentWord = null;
let currentMode = 'hanzi';
let typeMode = null;
let correct = 0, wrong = 0, total = 0;
let answered = false;
let autoNextTimer = null;

// ==================== KHỞI TẠO ====================
function loadFromStorage() {
  const saved = localStorage.getItem('zh_words');
  if (saved) {
    try { words = JSON.parse(saved); } catch(e) { words = []; }
  }
  if (words.length === 0 && defaultWords.length > 0) {
    words = defaultWords.slice();
    localStorage.setItem('zh_words', JSON.stringify(words));
  }
  const savedWrong = localStorage.getItem('zh_wrong');
  if (savedWrong) { try { wrongPool = JSON.parse(savedWrong); } catch(e) { wrongPool = []; } }
  const savedTypeMode = localStorage.getItem('zh_typemode');
  if (savedTypeMode === 'hanzi' || savedTypeMode === 'pinyin') typeMode = savedTypeMode;
  updateToggleButtons();
  updateUI();
}

function saveAll() {
  localStorage.setItem('zh_words', JSON.stringify(words));
  localStorage.setItem('zh_wrong', JSON.stringify(wrongPool));
}

// ==================== NẠP TỪ TEXT ====================
function loadWords(appendMode) {
  const text = document.getElementById('inputArea').value.trim();
  if (!text) { alert('Vui lòng nhập list từ vào ô text!'); return; }
  const lines = text.split('\n').filter(l => l.trim());
  const newWords = [];
  for (const line of lines) {
    let parts;
    if (line.includes('\t')) parts = line.split('\t');
    else if (line.includes('|')) parts = line.split('|');
    else parts = line.split(',');
    parts = parts.map(p => p.trim()).filter(p => p);
    if (parts.length >= 3) newWords.push({ hanzi: parts[0], pinyin: parts[1], meaning: parts[2] });
  }
  if (newWords.length === 0) { alert('Không đọc được từ nào. Kiểm tra định dạng: Hán tự | Pinyin | Nghĩa'); return; }
  applyNewWords(newWords, appendMode, 'text');
}

// ==================== NẠP EXCEL ====================
function loadExcel(event, appendMode) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
      let startIdx = 0;
      if (rows.length && /hán|hanzi|pinyin|nghĩa|meaning/i.test(String(rows[0][0] || ''))) startIdx = 1;
      const newWords = [];
      for (let i = startIdx; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[0]) continue;
        const hanzi = String(r[0]).trim();
        const pinyin = String(r[1] || '').trim();
        const meaning = String(r[2] || '').trim();
        if (hanzi && pinyin && meaning) newWords.push({ hanzi, pinyin, meaning });
      }
      if (newWords.length === 0) { alert('Không đọc được dữ liệu. Đảm bảo file có 3 cột: Hán tự | Pinyin | Nghĩa'); return; }
      applyNewWords(newWords, appendMode, 'Excel');
      event.target.value = '';
    } catch (err) {
      alert('Lỗi đọc file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ==================== ÁP DỤNG LIST MỚI ====================
function applyNewWords(newWords, appendMode, source) {
  if (appendMode) {
    const existing = new Set(words.map(w => w.hanzi + '|' + w.pinyin));
    let added = 0, skipped = 0;
    for (const w of newWords) {
      const key = w.hanzi + '|' + w.pinyin;
      if (existing.has(key)) { skipped++; continue; }
      words.push(w);
      existing.add(key);
      added++;
    }
    saveAll();
    updateUI();
    alert('✅ Đã thêm ' + added + ' từ từ ' + source + '.' + (skipped ? '\nBỏ qua ' + skipped + ' từ trùng.' : ''));
  } else {
    if (!confirm('Thay thế toàn bộ list hiện tại (' + words.length + ' từ) bằng ' + newWords.length + ' từ mới?')) return;
    words = newWords;
    saveAll();
    updateUI();
    alert('✅ Đã thay thế bằng ' + words.length + ' từ!');
  }
  showTab('quiz');
}

function clearWords() {
  if (confirm('Xóa hết list từ? (Có thể khôi phục list HSK 2 mặc định sau)')) {
    words = [];
    saveAll();
    updateUI();
  }
}

function restoreDefaults() {
  if (!confirm('Khôi phục list HSK 2 mặc định? List hiện tại sẽ bị thay thế.')) return;
  words = defaultWords.slice();
  saveAll();
  updateUI();
  alert('↩️ Đã khôi phục ' + words.length + ' từ HSK 2.');
}

// ==================== CẬP NHẬT UI ====================
function updateUI() {
  document.getElementById('countInfo').textContent = words.length ? '(' + words.length + ' từ)' : '';
  document.getElementById('listCount').textContent = words.length;
  document.getElementById('wordTable').innerHTML = words.map(w =>
    '<tr><td style="font-size:22px;">' + w.hanzi + '</td><td>' + w.pinyin + '</td><td>' + w.meaning + '</td></tr>'
  ).join('');
  document.getElementById('wrongPoolCount').textContent = wrongPool.length;
  if (words.length > 0 && !currentWord) nextQuestion();
}

// ==================== TAB ====================
function showTab(name) {
  ['input','quiz','list'].forEach(t => {
    document.getElementById('tab-' + t).classList.add('hidden');
  });
  document.getElementById('tab-' + name).classList.remove('hidden');
  if (name === 'quiz' && !currentWord && words.length) nextQuestion();
}

// ==================== CHẾ ĐỘ HỌC ====================
function setMode(mode) {
  currentMode = mode;
  typeMode = null;
  localStorage.setItem('zh_typemode', '');
  updateToggleButtons();
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  nextQuestion();
}

function toggleType(kind) {
  if (typeMode === kind) {
    typeMode = null;
    localStorage.setItem('zh_typemode', '');
  } else {
    typeMode = kind;
    localStorage.setItem('zh_typemode', kind);
  }
  updateToggleButtons();
  document.getElementById('optionsBox').innerHTML = '';
  document.getElementById('answerReveal').textContent = '';
  nextQuestion();
}

function updateToggleButtons() {
  const btnH = document.getElementById('typeHanziBtn');
  const btnP = document.getElementById('typePinyinBtn');
  btnH.classList.toggle('on', typeMode === 'hanzi');
  btnP.classList.toggle('on', typeMode === 'pinyin');
  btnH.textContent = typeMode === 'hanzi'
    ? '⌨️ Đang gõ Hán tự (hiện Nghĩa) — bấm để tắt'
    : '⌨️ Gõ Hán tự (hiện Nghĩa)';
  btnP.textContent = typeMode === 'pinyin'
    ? '⌨️ Đang gõ Pinyin (hiện Hán tự + Nghĩa) — bấm để tắt'
    : '⌨️ Gõ Pinyin (hiện Hán tự + Nghĩa)';
}

function normalize(str, mode) {
  let s = String(str).trim();
  if (mode === 'pinyin') {
    s = s.toLowerCase().replace(/\s+/g, '');
    s = removeTones(s);
  } else if (mode === 'meaning') {
    s = s.toLowerCase().replace(/\s+/g, ' ').trim();
  } else {
    s = s.replace(/\s+/g, '');
  }
  return s;
}

function removeTones(s) {
  const map = {
    'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e',
    'ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o',
    'ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v',
    'ü':'v'
  };
  return s.replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, ch => map[ch] || ch);
}

function setNextButtonEnabled(enabled) {
  document.getElementById('nextBtn').classList.toggle('highlight', enabled);
}

function cancelAutoNext() {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
}

// ==================== TẠO CÂU HỎI ====================
function nextQuestion() {
  cancelAutoNext();
  setNextButtonEnabled(false);

  let pool = words;
  if (currentMode === 'wrong' && !typeMode) {
    if (wrongPool.length === 0) {
      document.getElementById('promptText').textContent = '🎉 Không có từ sai!';
      document.getElementById('subText').textContent = 'Hãy học thêm để tạo danh sách từ sai.';
      document.getElementById('optionsBox').innerHTML = '';
      document.getElementById('optionsBox').classList.add('hidden');
      document.getElementById('typeBox').classList.add('hidden');
      document.getElementById('answerReveal').textContent = '';
      return;
    }
    pool = wrongPool;
  }
  if (pool.length === 0) {
    document.getElementById('promptText').textContent = 'Chưa có từ nào';
    document.getElementById('subText').textContent = 'Hãy nhập list từ trước';
    document.getElementById('optionsBox').innerHTML = '';
    document.getElementById('optionsBox').classList.add('hidden');
    document.getElementById('typeBox').classList.add('hidden');
    document.getElementById('answerReveal').textContent = '';
    return;
  }

  answered = false;
  currentWord = pool[Math.floor(Math.random() * pool.length)];

  const promptEl = document.getElementById('promptText');
  const subEl = document.getElementById('subText');
  document.getElementById('answerReveal').textContent = '';

  const optionsBox = document.getElementById('optionsBox');
  const typeBox = document.getElementById('typeBox');
  const input = document.getElementById('typeInput');

  if (typeMode === 'hanzi') {
    promptEl.textContent = currentWord.meaning;
    subEl.textContent = '';
    optionsBox.innerHTML = '';
    optionsBox.classList.add('hidden');
    typeBox.classList.remove('hidden');
    input.value = '';
    input.classList.remove('correct', 'wrong');
    input.disabled = false;
    setTimeout(() => input.focus(), 50);
    return;
  }

  if (typeMode === 'pinyin') {
    promptEl.textContent = currentWord.hanzi;
    subEl.textContent = currentWord.meaning;
    optionsBox.innerHTML = '';
    optionsBox.classList.add('hidden');
    typeBox.classList.remove('hidden');
    input.value = '';
    input.classList.remove('correct', 'wrong');
    input.disabled = false;
    setTimeout(() => input.focus(), 50);
    return;
  }

  typeBox.classList.add('hidden');
  input.value = '';
  input.classList.remove('correct', 'wrong');

  const effectiveMode = currentMode === 'wrong' ? 'hanzi' : currentMode;

  if (effectiveMode === 'hanzi') {
    promptEl.textContent = currentWord.pinyin;
    subEl.textContent = currentWord.meaning;
  } else if (effectiveMode === 'pinyin') {
    promptEl.textContent = currentWord.hanzi;
    subEl.textContent = currentWord.meaning;
  } else {
    promptEl.textContent = currentWord.hanzi;
    subEl.textContent = currentWord.pinyin;
  }

  const key = effectiveMode === 'hanzi' ? 'hanzi' : effectiveMode === 'pinyin' ? 'pinyin' : 'meaning';
  const correctAns = currentWord[key];

  optionsBox.classList.remove('hidden');
  optionsBox.innerHTML = '';

  const poolAll = words.filter(w => w[key] !== correctAns);
  const shuffled = poolAll.sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [correctAns, ...shuffled.map(w => w[key])].sort(() => Math.random() - 0.5);

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt, correctAns);
    optionsBox.appendChild(btn);
  });
}

// ==================== KIỂM TRA TRẮC NGHIỆM ====================
function checkAnswer(btn, chosen, correctAns) {
  if (answered) return;
  answered = true;
  total++;

  const allBtns = document.querySelectorAll('#optionsBox button');
  allBtns.forEach(b => {
    if (b.textContent === correctAns) b.classList.add('correct');
  });

  if (chosen === correctAns) {
    correct++;
    updateStats();
    autoNextTimer = setTimeout(() => nextQuestion(), 800);
  } else {
    wrong++;
    btn.classList.add('wrong');
    addToWrongPool();
    updateStats();
    setNextButtonEnabled(true);
  }
}

// ==================== KIỂM TRA GÕ ĐÁP ÁN ====================
function checkTyped() {
  if (answered) return;
  const input = document.getElementById('typeInput');
  const userAns = input.value;
  if (!userAns.trim()) return;

  let key, correctAns;
  if (typeMode === 'hanzi') {
    key = 'hanzi';
    correctAns = currentWord.hanzi;
  } else if (typeMode === 'pinyin') {
    key = 'pinyin';
    correctAns = currentWord.pinyin;
  } else {
    return;
  }

  answered = true;
  total++;

  const isCorrect = normalize(userAns, key) === normalize(correctAns, key);

  input.disabled = true;
  if (isCorrect) {
    correct++;
    input.classList.add('correct');
    document.getElementById('answerReveal').textContent = '✅ Chính xác!';
    updateStats();
    autoNextTimer = setTimeout(() => nextQuestion(), 800);
  } else {
    wrong++;
    input.classList.add('wrong');
    document.getElementById('answerReveal').textContent = '❌ Sai. Đáp án đúng: ' + correctAns;
    addToWrongPool();
    updateStats();
    setNextButtonEnabled(true);
  }
}

// ==================== HÀM PHỤ ====================
function addToWrongPool() {
  if (!wrongPool.some(w => w.hanzi === currentWord.hanzi && w.pinyin === currentWord.pinyin)) {
    wrongPool.push({ hanzi: currentWord.hanzi, pinyin: currentWord.pinyin, meaning: currentWord.meaning });
    document.getElementById('wrongPoolCount').textContent = wrongPool.length;
    saveAll();
  }
}

function updateStats() {
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = total;
}

function resetStats() {
  correct = 0; wrong = 0; total = 0;
  updateStats();
}

function resetWrongPool() {
  if (confirm('Xóa toàn bộ danh sách từ sai?')) {
    wrongPool = [];
    saveAll();
    document.getElementById('wrongPoolCount').textContent = 0;
  }
}

// ==================== KHỞI ĐỘNG ====================
loadFromStorage();
</script>
